plugins { id 'java' }
// Small Java 8 regression build, independent of the main Java 17 obfuscator build.
def skidRoot = projectDir.parentFile.parentFile
buildDir = new File(skidRoot, 'build/runtime-protection-tests')
repositories { mavenCentral() }
sourceCompatibility = '1.8'
targetCompatibility = '1.8'
sourceSets {
    main.java {
        srcDirs new File(skidRoot, 'dev.skidfuscator.sdk/src/main/java'), new File(skidRoot, 'dev.skidfuscator.obfuscator/src/main/java')
        include 'sdk/**', 'dev/skidfuscator/obfuscator/transform/impl/integrity/ArchiveSealer.java', 'dev/skidfuscator/obfuscator/transform/impl/integrity/RuntimeProtectionInstrumenter.java'
    }
    test.java {
        srcDirs new File(skidRoot, 'dev.skidfuscator.sdk/src/test/java'), new File(skidRoot, 'dev.skidfuscator.obfuscator/src/test/java')
        include 'sdk/integrity/**', 'dev/skidfuscator/obfuscator/transform/impl/integrity/ArchiveSealerTest.java'
    }
}
dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
test {
    useJUnitPlatform()
    jvmArgs '-Xverify:all'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
