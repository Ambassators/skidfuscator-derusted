# Protect threaded seed reconstruction in native VM helpers only.
# Merge this with your normal configuration and authenticated SkidLLVM toolchain settings.
# This is NOT a switch that disables unrelated Java obfuscation transformations.
interprocedural {
  enabled = true
  threadStaticMethods = true
}

native {
  enabled = true
  targets = ["windows-x86_64"]
  "include" = []

  threadedKey {
    enabled = true
    only = true
    mode = VM
  }

  # Integration-friendly response: keep authenticated VM payload protection,
  # but report validation failures rather than terminating the application.
  vm {
    profile = STANDARD
    response = THROW
    integrity = true
    antiDebug = false
    antiInstrumentation = false
    timingChecks = false
  }
}
